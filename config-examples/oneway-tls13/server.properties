# One-way TLS 1.3: the server presents its certificate; clients verify it.
tls.name=demo-server-oneway-tls13
tls.protocols=TLSv1.3
# Empty cipherSuites = JDK 17 JSSE security defaults.
tls.cipherSuites=
tls.clientAuthentication.mode=NONE

tls.keyStore.type=PKCS12
tls.keyStore.path=certs/openssl/server.p12
# Actual password is NOT stored here. It is resolved at runtime from
# TLS_KEYSTORE_PASSWORD (env or -D system property).
tls.keyStore.passwordKey=TLS_KEYSTORE_PASSWORD

tls.hostnameVerification.enabled=true
tls.connectTimeoutMillis=5000
tls.handshakeTimeoutMillis=10000
tls.socketTimeoutMillis=30000

demo.peer.host=localhost
demo.peer.port=8443
